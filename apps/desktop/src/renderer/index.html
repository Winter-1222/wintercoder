<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- CSP 限制脚本、图片、字体和网络来源，降低 Renderer 加载未知内容的风险。 -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' ws:;"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f7f5" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>霁雪 · Jixue</title>
  </head>
  <body>
    <!-- React 会把整个 App 渲染到这个空节点中。 -->
    <div id="root"></div>
    <!-- Vite 从 main.tsx 开始解析 Renderer 模块依赖。 -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
